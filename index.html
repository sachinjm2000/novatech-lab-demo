<body data-page="home">
<div class="progress" id="progress" aria-hidden="true"></div>
<div class="draft-banner" id="draftBanner" hidden><span data-i18n="demoBanner"></span></div>

<header class="topbar">
  <div class="wrap topbar-in">
    <a class="brand" href="index.html" aria-label="Novatech Hospital Laboratory">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-9V3"/><path d="M7.5 15h9"/></svg>
      </span>
      <span class="brand-text"><strong data-lab="labName"></strong><small data-i18n="brandSub"></small></span>
    </a>
    <nav class="nav" aria-label="Main" id="nav">
      <a href="#featured" data-i18n="navCheckups"></a>
      <a href="tests.html#tests" data-i18n="navAllTests"></a>
      <a href="#contact" data-i18n="navContact"></a>
      <a href="#" data-wa="report" data-i18n="getReport"></a>
    </nav>
    <button class="lang" id="langBtn" type="button" aria-label="Switch language">मराठी</button>
    <a class="btn btn-primary sm hcall" data-call href="#">📞 <span data-i18n="callShort"></span></a>
  </div>
</header>

<main id="top">

  <!-- HERO: headline, pill search with live suggestions, quick-pick chips, four round buttons -->
  <section class="hero lean center">
    <span class="blob b1" aria-hidden="true"></span><span class="blob b2" aria-hidden="true"></span>
    <div class="floaters" aria-hidden="true">
      <span style="--x:6%;--d:0s;--s:1.6rem">🩸</span><span style="--x:22%;--d:2.2s;--s:1.3rem">🧪</span><span style="--x:41%;--d:4.4s;--s:1.7rem">🔬</span>
      <span style="--x:63%;--d:1.1s;--s:1.4rem">💉</span><span style="--x:82%;--d:3.3s;--s:1.6rem">🧬</span><span style="--x:93%;--d:5.5s;--s:1.2rem">🩺</span>
    </div>
    <div class="wrap hero-c">
      <p class="eyebrow"><span class="live"></span><span data-i18n="eyebrow"></span></p>
      <h1><span data-i18n="heroPre"></span> <span class="rot" id="rot"></span></h1>
      <p class="lead" id="lead"></p>

      <form class="pillsearch" id="homeSearchForm" role="search" autocomplete="off">
        <svg class="ps-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="homeSearch" type="search" role="combobox" aria-expanded="false" aria-controls="suggest" aria-autocomplete="list" autocomplete="off" data-i18n-ph="searchHome" aria-label="Search tests and checkups">
        <button type="submit" class="ps-go" aria-label="Search"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        <ul class="suggest" id="suggest" role="listbox" hidden></ul>
      </form>
      <div class="chipbar" id="chipbar"></div>

      <div class="rbtns">
        <a class="rbtn" href="tests.html#tests"><span class="rb-c"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6M10 3v15a2 2 0 0 0 4 0V3M10 12h4"/></svg></span><b data-i18n="bookTest"></b></a>
        <a class="rbtn" href="#featured"><span class="rb-c"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5c0 5-3.2 8-7 10-3.8-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg></span><b data-i18n="navCheckups"></b></a>
        <a class="rbtn" href="#options"><span class="rb-c"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg></span><b data-i18n="navHome"></b></a>
        <a class="rbtn" data-wa="report" href="#"><span class="rb-c"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg></span><b data-i18n="qReport"></b></a>
      </div>

      <p class="rx-link"><a class="link-sm" data-wa="rx" href="#" data-i18n="uploadRx"></a></p>
      <div class="cta-row ctr-row">
        <a class="btn btn-wa" data-wa="hello" href="#"><span data-i18n="ctaWhatsapp"></span></a>
        <a class="btn btn-ghost" data-call href="#"><span data-i18n="ctaCall"></span></a>
      </div>
      <div class="photo banner" data-photo="hero"></div>
    </div>
  </section>

  <!-- GUIDED FINDER: two taps to a suggested checkup -->
  <section class="sec tight" id="finder">
    <div class="wrap">
      <div class="finder card">
        <h2 data-i18n="finderTitle"></h2>
        <p class="sub" data-i18n="finderSub"></p>
        <div id="finderBody" aria-live="polite"></div>
      </div>
    </div>
  </section>

  <!-- AREA CHECK + BROWSE BY NEED -->
  <section class="sec tight" id="options">
    <div class="wrap">
      <div class="areastrip card">
        <h2 data-i18n="areaShort"></h2>
        <div class="area-row">
          <label class="sr-only" for="areaSel" data-i18n="areaPick"></label>
          <select id="areaSel"></select>
          <a class="btn btn-wa" data-wa="area" href="#"><span data-i18n="areaBook"></span></a>
        </div>
        <p class="area-result" id="areaResult" aria-live="polite"></p>
        <ul class="chips" id="areaChips"></ul>
      </div>

      <h2 class="mt ctr" data-i18n="browseTitle"></h2>
      <p class="sub ctr" data-i18n="tilesSub"></p>
      <div class="rgrid" id="tiles"></div>
      <p class="center"><a class="btn btn-primary" href="tests.html#tests" data-i18n="allTestsBtn"></a></p>
    </div>
  </section>

  <!-- FEATURED CHECKUPS -->
  <section id="featured" class="sec alt">
    <div class="wrap">
      <h2 data-i18n="featTitle"></h2>
      <div id="season"></div>
      <p class="filter-label" data-i18n="whoFor"></p>
      <div class="tabs" id="pkgFilter" role="tablist"></div>
      <div class="grid pkgs" id="pkgGrid"></div>
      <p class="center"><a class="btn btn-ghost" href="tests.html#packages" data-i18n="seeAllPkgs"></a></p>
    </div>
  </section>

  <!-- NUMBERS BANNER (all values come from the site's own data) -->
  <section class="statsec" id="numbers" aria-label="Lab in numbers">
    <div class="wrap"><div class="statband" id="statBand"></div></div>
  </section>

  <!-- MEET YOUR LAB: real photos + proof -->
  <section class="sec" id="why">
    <div class="wrap">
      <h2 data-i18n="meetTitle"></h2>
      <div class="meet">
        <div class="photo" data-photo="lab"></div>
        <div class="photo" data-photo="team"></div>
        <div class="photo" data-photo="collection"></div>
      </div>
      <div class="grid trustgrid" id="trustGrid"></div>
    </div>
  </section>

  <!-- HOW IT WORKS (one compact row) -->
  <section class="band">
    <div class="wrap">
      <ol class="steps compact">
        <li><span class="n">1</span><div><strong data-i18n="s1t"></strong><p data-i18n="s1d"></p></div></li>
        <li><span class="n">2</span><div><strong data-i18n="s2t"></strong><p data-i18n="s2d"></p></div></li>
        <li><span class="n">3</span><div><strong data-i18n="s3t"></strong><p data-i18n="s3d"></p></div></li>
        <li><span class="n">4</span><div><strong data-i18n="s4t"></strong><p data-i18n="s4d"></p></div></li>
      </ol>
    </div>
  </section>

  <!-- REVIEWS (hidden until real Google reviews are added) -->
  <section class="sec alt" id="reviews" hidden>
    <div class="wrap">
      <h2 data-i18n="reviewsTitle"></h2>
      <div class="grid reviews" id="reviewGrid"></div>
    </div>
  </section>

  <!-- CONTACT -->
  <section id="contact" class="sec">
    <div class="wrap two">
      <div>
        <h2 data-i18n="contactTitle"></h2>
        <dl class="facts">
          <dt data-i18n="cAddr"></dt><dd data-lab="address"></dd>
          <dt data-i18n="cLab"></dt><dd data-lab="hoursLab"></dd>
          <dt data-i18n="cReport"></dt><dd data-lab="hoursReport"></dd>
          <dt data-i18n="cPhone"></dt><dd data-lab="phone"></dd>
          <dt data-i18n="cPath"></dt><dd data-lab="pathologist"></dd>
          <dt data-i18n="cAccr"></dt><dd data-lab="accreditation"></dd>
        </dl>
        <a class="btn btn-ghost" id="mapBtn" href="#" target="_blank" rel="noopener"><span data-i18n="cMap"></span></a>
        <a class="link-sm" id="reviewLink" href="#" target="_blank" rel="noopener" hidden data-i18n="reviewLink"></a>
      </div>
      <div class="card">
        <div class="photo wide" data-photo="building"></div>
        <h3 class="mt-s" data-i18n="inHospital"></h3>
        <p data-i18n="inHospitalD"></p>
        <a class="btn btn-wa btn-block" data-wa="hello" href="#"><span data-i18n="ctaWhatsapp"></span></a>
        <a class="btn btn-ghost btn-block" data-wa="opd" href="#"><span data-i18n="bookOpd"></span></a>
      </div>
    </div>
  </section>
